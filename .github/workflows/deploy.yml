name: EC2 자동 배포 (Develop)

on:
  push:
    branches:
      - develop

  workflow_dispatch:

concurrency:
  group: deploy-develop
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 EC2 서버 접속 및 최신 버전 배포
        uses: appleboy/ssh-action@v1.2.5

        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}

          script: |
            set -e

            # 1. 프로젝트 폴더로 이동
            cd ~/2026_fall_festival_back

            # 2. develop 최신 상태로 정확히 맞춤
            git fetch origin
            git switch -C develop origin/develop

            # 3. 새로운 Django 이미지 먼저 빌드
            docker compose -f deploy/docker-compose.prod.yml build web

            # 4. DB 마이그레이션
            docker compose -f deploy/docker-compose.prod.yml run --rm web \
              python manage.py migrate --noinput

            # 5. 정적 파일 수집
            docker compose -f deploy/docker-compose.prod.yml run --rm web \
              python manage.py collectstatic --noinput

            # 6. Redis + Django + Nginx 실행/갱신
            docker compose -f deploy/docker-compose.prod.yml up -d

            # 7. 사용하지 않는 Docker 이미지 정리
            docker image prune -f

            # 8. 배포 상태 확인
            docker compose -f deploy/docker-compose.prod.yml ps