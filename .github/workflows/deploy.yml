name: EC2 자동 배포 (Develop)

on:
  push:
    branches:
      - develop

  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-backend
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: self-hosted

    env:
      DEPLOY_BRANCH: ${{ github.ref_name }}

    steps:
      - name: EC2 자동 배포
        shell: bash
        run: |
          set -euo pipefail

          BACK_DIR=/home/ubuntu/2026_fall_festival_back

          echo "배포 브랜치: $DEPLOY_BRANCH"

          cd "$BACK_DIR"

          git fetch origin
          git switch -C "$DEPLOY_BRANCH" "origin/$DEPLOY_BRANCH"

          docker compose -f deploy/docker-compose.prod.yml build web

          docker compose -f deploy/docker-compose.prod.yml run --rm web \
            python manage.py migrate --noinput

          docker compose -f deploy/docker-compose.prod.yml run --rm web \
            python manage.py collectstatic --noinput

          docker compose -f deploy/docker-compose.prod.yml up -d

          docker image prune -f

          docker compose -f deploy/docker-compose.prod.yml ps