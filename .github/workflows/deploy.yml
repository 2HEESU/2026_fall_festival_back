name: EC2 자동 배포 (Production)

on:
  push:
    branches:
      - main   # 👈 main 브랜치에 코드가 들어오면(Merge되면) 자동으로 배포 실행!
  workflow_dispatch: # 👈 필요할 때 깃허브 웹에서 버튼 눌러서 수동 배포도 가능

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 EC2 서버 접속 및 최신 버전 배포
        uses: appleboy/ssh-action@v1.2.5
        with:
          host: ${{ secrets.EC2_HOST }}
          username: ${{ secrets.EC2_USERNAME }}
          key: ${{ secrets.EC2_SSH_KEY }}
          script: |
            # 1. 서버 프로젝트 폴더로 이동
            cd ~/2026_fall_festival_back
            
            # 2. main 브랜치 최신 코드 당겨오기
            git pull origin main
            
            # 3. DB 마이그레이션 적용
            docker compose -f deploy/docker-compose.prod.yml run --rm web python manage.py migrate --noinput
            
            # 4. 정적 파일 수집
            docker compose -f deploy/docker-compose.prod.yml run --rm web python manage.py collectstatic --noinput
            
            # 5. 새 코드로 도커 컨테이너 재실행
            docker compose -f deploy/docker-compose.prod.yml up -d --build
            
            # 6. 이전 이미지 정리
            docker image prune -f