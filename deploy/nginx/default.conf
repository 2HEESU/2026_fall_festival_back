# 1. Django 백엔드 컨테이너 정의 (Docker 내부 네트워크 통신)
upstream django_backend {
    server web:8000;
}

upstream django_backend {
    server web:8000;
}

# ========================================================
# 1. 일반 사용자 사이트 (dgufesta.com)
# ========================================================
server {
    listen 80;
    server_name dgufesta.com www.dgufesta.com localhost;

    client_max_body_size 20M;

    # (1) index.html은 항상 최신 버전을 확인하도록 no-cache 설정 (반영 완료!)
    location = /index.html {
        root /usr/share/nginx/html/user;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # (2) 빌드된 JS/CSS/이미지 에셋은 강력 캐싱 (1년)
    location /assets/ {
        root /usr/share/nginx/html/user;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # (3) Django 정적 파일 & 미디어 파일 서빙
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # (4) API 요청은 Django 백엔드로 프록시
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (5) SPA 라우팅
    location / {
        root /usr/share/nginx/html/user;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# 2. 관리자 사이트 (admin.dgufesta.com)
# ========================================================
server {
    listen 80;
    server_name admin.dgufesta.com;

    client_max_body_size 20M;

    # (1) 관리자 index.html no-cache 설정 (반영 완료!)
    location = /index.html {
        root /usr/share/nginx/html/admin;
        add_header Cache-Control "no-cache, no-store, must-revalidate";
    }

    # (2) 관리자 에셋 캐싱
    location /assets/ {
        root /usr/share/nginx/html/admin;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # (3) 관리자 정적 파일 & 미디어 파일 서빙
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # (4) 관리자 API 요청
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (5) 관리자 SPA 라우팅
    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}