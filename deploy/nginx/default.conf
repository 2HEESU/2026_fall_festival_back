# 1. Django 백엔드 컨테이너 정의 (Docker 내부 네트워크 통신)
upstream django_backend {
    server web:8000;
}

# ========================================================
# 2. 일반 사용자 사이트 (dgufesta.com)
# ========================================================
server {
    listen 80;
    server_name dgufesta.com www.dgufesta.com localhost;

    client_max_body_size 20M;

    # (1) React/Vite 정적 빌드 파일 캐싱 헤더 (CDN 설정 연동)
    location /assets/ {
        root /usr/share/nginx/html/user;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    # (2) Django 정적 파일 & 미디어 파일 서빙
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # (3) API 요청은 Django 백엔드(Gunicorn)로 프록시 전달
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (4) 일반 웹 화면 요청 (React SPA 라우팅 지원)
    location / {
        root /usr/share/nginx/html/user;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}

# ========================================================
# 3. 관리자 사이트 (admin.dgufesta.com)
# ========================================================
server {
    listen 80;
    server_name admin.dgufesta.com;

    client_max_body_size 20M;

    # (1) 관리자 React 에셋 캐싱
    location /assets/ {
        root /usr/share/nginx/html/admin;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable";
        access_log off;
    }

    #  (2) Django 정적 파일 & 미디어 파일 서빙 (관리자 이미지 미리보기/조회용 추가!)
    location /static/ {
        alias /app/staticfiles/;
    }

    location /media/ {
        alias /app/media/;
    }

    # (3) 관리자 API 요청 (Cloudflare JWT 토큰 헤더 전달)
    location /api/ {
        proxy_pass http://django_backend;
        proxy_http_version 1.1;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $http_cf_connecting_ip;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header CF-Connecting-IP $http_cf_connecting_ip;
        proxy_set_header Cf-Access-Jwt-Assertion $http_cf_access_jwt_assertion;

        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }

    # (4) 관리자 웹 화면 요청 (React Admin SPA 라우팅)
    location / {
        root /usr/share/nginx/html/admin;
        index index.html;
        try_files $uri $uri/ /index.html;
    }
}